<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DenHeyer Electric - Review Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #e0e9ff;
      background-image: url("https://www.transparenttextures.com/patterns/lined-paper-2.png");
      background-repeat: repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    .header-bar {
      background-color: #2C4FA0;
      padding: 1vh 0;
      text-align: center;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .header-bar h1 {
      margin: 0;
    }

    .home-link {
      text-decoration: none;
      color: inherit;
    }

    .denheyer {
      font-family: 'Anton', sans-serif;
      font-size: 5vw;
      letter-spacing: .2vw;
      color: #ffffff;
    }

    .electric {
      font-family: 'Teko', sans-serif;
      font-size: 5vw;
      letter-spacing: .2vw;
      color: #ffffff;
    }

    .page-section {
      margin: 12vh auto;
      padding: 5vh 2vw;
      max-width: 60vw;
      background-color: #f8f9fa;
      border-radius: 1.5vw;
      box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .review-container {
      text-align: left;
      font-size: 1.2vw;
      margin-bottom: 3vh;
    }

    .pagination {
      margin: 3vh 0;
      font-size: 1.1vw;
    }

    .pagination a {
      margin: 0 1vw;
      color: #2C4FA0;
      text-decoration: none;
    }

    .pagination a:hover {
      text-decoration: underline;
    }

    .nav-links {
      font-size: 1.2vw;
      margin-top: 3vh;
    }

    .nav-links a {
      color: #2C4FA0;
      text-decoration: none;
      margin: 0 1vw;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>
      <a href="/" class="home-link">
        <span class="denheyer">DenHeyer </span>
        <span class="electric">ELECTRIC</span>
      </a>
    </h1>
  </div>

  <div class="page-section">
    <h2>Privated Reviews</h2>

    <div class="review-container">
      {{ formatted_reviews_private | safe }}
    </div>

    <div class="pagination">
      {{ pagination_links | safe }}
    </div>

    <div class="nav-links">
      <a href="/reviewManager/public">View Public Reviews</a>
      <a href="/employeePortal">Return to Portal</a>
    </div>
  </div>

</body>
</html>
