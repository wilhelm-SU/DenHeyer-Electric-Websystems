<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DenHeyer Electric - Employee Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">

    <link rel="icon" href="/static/images/LightBulbOG_AnniePaxson.png" sizes="any">
  <link rel="icon" type="image/png" href="/static/images/LightBulbOG_AnniePaxson.png">
  <link rel="apple-touch-icon" href="/static/images/LightBulbOG_AnniePaxson.png">

  <!-- Styles -->
  <style>
    body {
      background-color: #e0e9ff;
      background-image: url("https://www.transparenttextures.com/patterns/lined-paper-2.png");
      background-repeat: repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    .header-bar {
      background-color: #2C4FA0;
      padding: -2vh 0;
      text-align: center;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1;
    }

    .header-bar h1 {
      margin: 0;
    }

    .home-link {
      text-decoration: none;
      color: inherit;
    }

    .home-link:hover {
      text-decoration: none; /* This prevents underline on hover */
    }

    .denheyer {
      font-family: 'Anton', sans-serif;
      font-size: 5vw;
      letter-spacing: .2vw;
      color: #ffffff;
    }

    .electric {
      font-family: 'Teko', sans-serif;
      font-size: 5vw;
      letter-spacing: .2vw;
      color: #ffffff;
    }

    .portal-section {
      margin: 12vh auto;
      padding: 5vh 2vw;
      max-width: 50vw;
      background-color: #f8f9fa;
      border-radius: 1.5vw;
      box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .portal-section h2 {
      font-size: 2.5vw;
      color: #2C4FA0;
      margin-bottom: 4vh;
    }

    .portal-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2vh;
      justify-items: center;
      text-align: center;
    }

    .portal-links a {
      display: block;
      background-color: #2C4FA0;
      color: white;
      padding: 1.5vh 2vw;
      border-radius: 1vw;
      text-decoration: none;
      font-size: 1.3vw;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .portal-links a:hover {
      background-color: #1d3671;
    }
  </style>
</head>
<body>

  <!-- Header with split-font title -->
  <div class="header-bar">
    <h1>
      <a href="/employeePortal" class="home-link">
        <span class="denheyer">DenHeyer </span>
        <span class="electric">ELECTRIC</span>
      </a>
    </h1>
  </div>

  <!-- Employee Portal Content -->
  <div class="portal-section">
    <h2>Welcome to the Employee Portal, {{ username }}</h2>
    <div class="portal-links">
      <a href="/reviewManager/public">Review Manager</a>
      <a href="/estimateManager/open">Estimate Manager</a>
      <a href="/galleryManager/galleryManager">Gallery Manager</a>
      <a href="/employeeManager">User Manager</a>
      <a href="/employeeSettings">Account Settings</a>
      <a href="/logout">Logout</a>
    </div>
  </div>

</body>
</html>
