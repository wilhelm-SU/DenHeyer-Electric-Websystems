<!DOCTYPE html>
<html>
<head>
<title>DenHeyer Electric</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500&display=swap" rel="stylesheet">
<style>
body {background-color:Azure;
      overflow-y: scroll;
      margin: 0;
      padding: 0;}
h1 {text-align: center;}
</style>
</head>
<body>

<div class="header-bar">
    <img src="/static/images/LightBulbOG_AnniePaxson.png" alt="Lightbulb" class="lightbulb">
    <div class="title-oval">
        <h1><span class="denheyer">DenHeyer</span> <span class="electric">ELECTRIC</span></h1>
    </div>
  <nav class="navbar">
    <a href="/requestEstimate">Request Your Free Estimate</a>
    <a href="/gallery">Gallery</a>
    <a href="/reviews">Leave a Review</a>
    <!-- Dropdown Container -->
    <div class="dropdown">
      <button class="dropbtn">More ▼</button>
      <div class="dropdown-content">
        <a href="/aboutUs">About Us</a>
        <a href="/employeeLogin">Employee Login</a>
        <a href="/employeePortal">Employee Portal</a>
      </div>
    </div>
  </nav>
</div>

<div class="sidebar left"></div>
<div class="sidebar right"></div>



<style>
   /* Unified Header Bar */
 .header-bar {
  background-color: #2C4FA0; /* Your blue color */
  padding: 15px 0;
  text-align: center;
  width: 100%;
  position: absolute; /* Ensures it starts at the top */
  top: 0; /* Forces it to the very top */
  left: 0;
  z-index: 1; /* Stays above the sidebars */
  }

  /* Title inside the header */
  .header-bar h1 {
    color: #2C4FA0; /* Slightly off-white */
    font-size: 70px;
    margin: 0;
    padding-bottom: 10px;
  }

  /* Navigation inside the header */
  .navbar {
    display: flex;
    justify-content: center;
    gap: 40px;
  }

  .navbar a, .dropbtn {
    color: #F0F0F0; /* Slightly off-white */
    text-decoration: none;
    font-size: 26px;
    padding: 14px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }

  .navbar a:hover, .dropbtn:hover {
    background-color: #A3B6E9;
    border-radius: 5px;
  }

  /* Dropdown container */
  .dropdown {
    position: relative;
    display: inline-block;
  }

  /* Dropdown menu (hidden by default) */
  .dropdown-content {
    display: none;
    position: absolute;
    background-color: #F8F9FA; /* Soft Gray */
    min-width: 150px;
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
    z-index: 1;
    border-radius: 5px;
  }

  /* Dropdown menu links */
  .dropdown-content a {
    color: black;
    padding: 10px;
    display: block;
    text-align: left;
  }

  .dropdown-content a:hover {
    background-color: #A3B6E9;
  }

  /* Show dropdown on hover */
  .dropdown:hover .dropdown-content {
    display: block;
  }

/* Sidebar styles */
.sidebar {
  position: fixed;  /* Keeps them fixed on the sides */
  top: 0; /* Start at the very top */
  width: 1in; /* 1-inch thick */
  height: 100vh; /* Full height */
  background-color: gray;
  z-index: -1; /* Pushes the sidebars behind everything */
}

/* Positioning the left and right bars */
.left {
  left: 0; /* Stick to the left */
}

.right {
  right: 0; /* Stick to the right */}

.lightbulb {
  position: absolute;
  top: 11px;
  left: 35px;
  height: 325px;
  width: auto;
  z-index: 2;
}

.denheyer {
  font-family: 'Anton', sans-serif;
  font-size: 100px;
  letter-spacing: 5px;

}

.electric {
  font-family: 'Teko', sans-serif;
  font-size: 110px;
  letter-spacing: 3px;
}

.title-oval {
  display: flex;  /* Flex enables centering */
  justify-content: center; /* Horizontal center */
  align-items: center;     /* Vertical center */
  background-color: #ffffff;
  border-radius: 200px;
  padding: 30px 20px;
  margin-top: 10px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  height: 100px;
}


</style>

</body>
</html>
