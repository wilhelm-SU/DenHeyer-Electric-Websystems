<!DOCTYPE html>
<html>
<head>
<title>DenHeyer Electric</title>
<style>
body {background-color:Azure;
      overflow-y: scroll;
      margin: 0;
      padding: 0;}
h1 {text-align: center;}
</style>
</head>
<body>

<div class="header-bar">
  <h1>DenHeyer Electric</h1>
  <nav class="navbar">
    <a href="/requestEstimate">Request Your Free Estimate</a>
    <a href="/gallery">Gallery</a>
    <a href="/reviews">Leave a Review!</a>
    <!-- Dropdown Container -->
    <div class="dropdown">
      <button class="dropbtn">More ▼</button>
      <div class="dropdown-content">
        <a href="/aboutUs">About Us</a>
        <a href="/employeeLogin">Employee Login</a>
        <a href="portal.html">Employee Portal</a>
      </div>
    </div>
  </nav>
</div>

<div class="sidebar left"></div>
<div class="sidebar right"></div>



<style>
   /* Unified Header Bar */
 .header-bar {
  background-color: #2C4FA0; /* Your blue color */
  padding: 15px 0;
  text-align: center;
  width: 100%;
  position: absolute; /* Ensures it starts at the top */
  top: 0; /* Forces it to the very top */
  left: 0;
  z-index: 1; /* Stays above the sidebars */
  }

  /* Title inside the header */
  .header-bar h1 {
    color: #F0F0F0; /* Slightly off-white */
    font-size: 50px;
    margin: 0;
    padding-bottom: 10px;
  }

  /* Navigation inside the header */
  .navbar {
    display: flex;
    justify-content: center;
    gap: 30px;
  }

  .navbar a, .dropbtn {
    color: #F0F0F0; /* Slightly off-white */
    text-decoration: none;
    font-size: 20px;
    padding: 10px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }

  .navbar a:hover, .dropbtn:hover {
    background-color: #A3B6E9;
    border-radius: 5px;
  }

  /* Dropdown container */
  .dropdown {
    position: relative;
    display: inline-block;
  }

  /* Dropdown menu (hidden by default) */
  .dropdown-content {
    display: none;
    position: absolute;
    background-color: #F8F9FA; /* Soft Gray */
    min-width: 150px;
    box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
    z-index: 1;
    border-radius: 5px;
  }

  /* Dropdown menu links */
  .dropdown-content a {
    color: black;
    padding: 10px;
    display: block;
    text-align: left;
  }

  .dropdown-content a:hover {
    background-color: #A3B6E9;
  }

  /* Show dropdown on hover */
  .dropdown:hover .dropdown-content {
    display: block;
  }

/* Sidebar styles */
.sidebar {
  position: fixed;  /* Keeps them fixed on the sides */
  top: 0; /* Start at the very top */
  width: 1in; /* 1-inch thick */
  height: 100vh; /* Full height */
  background-color: gray;
  z-index: -1; /* Pushes the sidebars behind everything */
}

/* Positioning the left and right bars */
.left {
  left: 0; /* Stick to the left */
}

.right {
  right: 0; /* Stick to the right */}
}

</style>

</body>
</html>
