<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DenHeyer Electric - Reviews</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Styles -->
  <style>

    .reviews-container {
      background-color: #f8f9fa;
      padding: 5vh 3vw;
      border-radius: 1.5vw;
      box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.2);
      max-width: 60vw;
      margin: auto;
      font-size: 1.2vw;
    }

    .reviews-container h2 {
      color: #2C4FA0;
      text-align: center;
      font-size: 2.4vw;
    }

    .actions {
      margin-top: 4vh;
      text-align: center;
    }

    .actions a {
      display: inline-block;
      margin: 0 1vw;
      color: #2C4FA0;
      font-size: 1.2vw;
      text-decoration: none;
    }

    .actions a:hover {
      text-decoration: underline;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 1vw;
      margin-top: 4vh;
      flex-wrap: wrap;
    }

    .pagination a,
    .pagination strong {
      padding: 0.6vh 1.2vw;
      font-size: 1.2vw;
      text-decoration: none;
      color: #2C4FA0;
      background-color: #ffffff;
      border: 2px solid #2C4FA0;
      border-radius: 0.5vw;
      transition: background-color 0.3s;
    }

    .pagination a:hover {
      background-color: #2C4FA0;
      color: #ffffff;
    }

    .pagination strong {
      background-color: #2C4FA0;
      color: #ffffff;
      border-color: #2C4FA0;
    }
  </style>
</head>
<body>

 {% include 'header.html' %}


  <!-- Reviews Section -->
  <div class="reviews-container">
    <h2>Welcome to the Reviews</h2>
    {{ formatted_reviews | safe }}

    <div class="pagination">
      {{ pagination_links | safe }}
    </div>

    <div class="actions">
      <a href="/writeAReview">Write a Review</a>
      <a href="/">Return</a>
    </div>
  </div>

</body>
</html>
