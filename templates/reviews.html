<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DenHeyer Electric - Reviews</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <style>
    body {
      background-color: #e0e9ff;
      background-image: url("https://www.transparenttextures.com/patterns/lined-paper-2.png");
      background-repeat: repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    .header-bar {
      background-color: #2C4FA0;
      text-align: center;
      padding: -2vh 0;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1;
    }

    .header-bar h1 {
      margin: 0;
    }

    .home-link {
      text-decoration: none;
      color: inherit;
    }

    .denheyer {
      font-family: 'Anton', sans-serif;
      font-size: 5vw;
      letter-spacing: .2vw;
      color: #ffffff;
    }

    .electric {
      font-family: 'Teko', sans-serif;
      font-size: 5vw;
      letter-spacing: .2vw;
      color: #ffffff;
    }

    .reviews-container {
      background-color: #f8f9fa;
      padding: 5vh 3vw;
      border-radius: 1.5vw;
      box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.2);
      max-width: 60vw;
      margin: 12vh auto;
      font-size: 1.2vw;
    }

    .reviews-container h2 {
      color: #2C4FA0;
      text-align: center;
      font-size: 2.4vw;
      text-decoration: underline;
    }

    .pagination {
      margin-top: 2vh;
      text-align: center;
    }

    .actions {
      margin-top: 4vh;
      text-align: center;
    }

    .actions a {
      display: inline-block;
      margin: 0 1vw;
      color: #2C4FA0;
      font-size: 1.2vw;
      text-decoration: none;
    }

    .actions a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Header with split-font title -->
  <div class="header-bar">
    <h1>
      <a href="/" class="home-link">
        <span class="denheyer">DenHeyer </span>
        <span class="electric">ELECTRIC</span>
      </a>
    </h1>
  </div>

  <!-- Reviews Section -->
  <div class="reviews-container">
    <h2>Welcome to the Reviews</h2>
    {{ formatted_reviews | safe }}

    <div class="pagination">
      {{ pagination_links | safe }}
    </div>

    <div class="actions">
      <a href="/writeAReview">Write a Review</a>
      <a href="/">Return to Home</a>
    </div>
  </div>

</body>
</html>
