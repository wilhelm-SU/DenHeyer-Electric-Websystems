<!DOCTYPE html>
<html lang="en">
 <style>
    body {
      background-color: Azure;
      font-family: Arial, sans-serif;
    }
    h1 {
      text-align: center;
      color: LightGray;
      font-size: 80px;
      background-color: SteelBlue;
      padding: 20px;
    }
    form {
      width: 80%;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 20px;
      padding: 20px;
    }
    .form-group {
      width: 45%;  /* Make the form elements take up half the width */
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .form-group input, .form-group textarea {
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 5px;
      width: 100%;
    }
    .form-group textarea {
      height: 150px;
      resize: vertical;  /* Allow vertical resizing of the textarea */
    }
    input[type="submit"] {
      width: 100%;
      background-color: SteelBlue;
      color: white;
      padding: 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    input[type="submit"]:hover {
      background-color: DarkSlateBlue;
    }
    a {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 16px;
      color: SteelBlue;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>

    <meta charset="UTF-8">
    <title>Request an Estimate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Request an Estimate</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('estimate.requestEstimate') }}" class="form-box">
            <label>Full Name *</label>
            <input type="text" name="name" maxlength="50" required>

            <label>Phone Number *</label>
            <input type="text" name="phone" maxlength="13" required>

            <label>Email</label>
            <input type="email" name="email" maxlength="75">

            <label>Street Address *</label>
            <input type="text" name="address" maxlength="255" required>

            <label>City *</label>
            <input type="text" name="city" maxlength="75" required>

            <label>ZIP Code *</label>
            <input type="text" name="zipCode" maxlength="10" required>

            <label>Description of Work</label>
            <textarea name="description" rows="4" maxlength="750"></textarea>

            <button type="submit">Submit Request</button>
        </form>
    </div>
</body>
</html>
</body>
</html>
