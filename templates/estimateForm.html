<!DOCTYPE html>
<html lang="en">
<head>
  <title>DenHeyer Electric - Request Estimate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <style>
    body {
      background-color: #e0e9ff;
      background-image: url("https://www.transparenttextures.com/patterns/lined-paper-2.png");
      background-repeat: repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    .header-bar {
      background-color: #2C4FA0;
      padding: -2vh 0;
      text-align: center;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1;
    }

    .header-bar h1 {
      margin: 0;
    }

    .home-link {
      text-decoration: none;
      color: inherit;
    }

    .denheyer {
      font-family: 'Anton', sans-serif;
      font-size: 5vw;
      letter-spacing: .2vw;
      color: #ffffff;
    }

    .electric {
      font-family: 'Teko', sans-serif;
      font-size: 5vw;
      letter-spacing: .2vw;
      color: #ffffff;
    }

    .home-section {
      background-color: #f8f9fa;
      padding: 5vh 3vw;
      border-radius: 1.5vw;
      box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.2);
      max-width: 60vw;
      margin: 12vh auto;
      font-size: 1.2vw;
    }

    .home-section h2 {
      font-size: 2.5vw;
      color: #2C4FA0;
      margin-bottom: 3vh;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 2vh;
    }

    form label {
      font-weight: 700;
      font-size: 1.2vw;
      text-align: left;
      margin-left: 1vw;
    }

    form input[type="text"],
    form input[type="email"],
    form textarea {
      padding: 1vh 1vw;
      font-size: 1.2vw;
      border: 1px solid #2C4FA0;
      border-radius: 0.5vw;
      width: 90%;
      max-width: 40vw;
      margin: 0 auto;
      font-family: 'Kanit', sans-serif;
    }

    form textarea {
      height: 20vh;
      resize: vertical;
    }

    form button[type="submit"] {
      margin-top: 2vh;
      padding: 1vh 2vw;
      font-size: 1.2vw;
      background-color: #2C4FA0;
      color: white;
      border: none;
      border-radius: 1vw;
      cursor: pointer;
    }

    form button[type="submit"]:hover {
      background-color: #1d3671;
    }

    .return-link {
      display: block;
      margin-top: 2vh;
      color: #2C4FA0;
      font-size: 1.2vw;
      text-decoration: none;
      text-align: center;
    }

    .return-link:hover {
      text-decoration: underline;
    }

    .flash {
      background-color: #eaf4ff;
      color: #2C4FA0;
      padding: 1vh;
      border-radius: 0.5vw;
      margin-bottom: 2vh;
    }
  </style>
</head>
<body>

  <!-- Header with split-font title -->
  <div class="header-bar">
    <h1>
      <a href="/" class="home-link">
        <span class="denheyer">DenHeyer </span>
        <span class="electric">ELECTRIC</span>
      </a>
    </h1>
  </div>

  <!-- Estimate Request Form -->
  <div class="home-section" id="request-estimate">
    <h2>Request an Estimate</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('estimate.requestEstimate') }}">
      <label>Full Name: *</label>
      <input type="text" name="name" maxlength="50" required>

      <label>Phone Number: *</label>
      <input type="text" name="phone" maxlength="13" required>

      <label>Email:</label>
      <input type="email" name="email" maxlength="75">

      <label>Street Address: *</label>
      <input type="text" name="address" maxlength="255" required>

      <label>City: *</label>
      <input type="text" name="city" maxlength="75" required>

      <label>ZIP Code: *</label>
      <input type="text" name="zipCode" maxlength="10" required>

      <label>Description of Work:</label>
      <textarea name="description" rows="4" maxlength="750"></textarea>

      <button type="submit">Submit Request</button>
      <a href="/" class="return-link">Return</a>
    </form>
  </div>
</body>
</html>
