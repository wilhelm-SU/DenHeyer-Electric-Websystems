<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Email - DenHeyer Electric</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #e0e9ff;
      background-image: url("https://www.transparenttextures.com/patterns/lined-paper-2.png");
      background-repeat: repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    .page-section {
      margin: 14vh auto;
      padding: 4vh 4vw;
      max-width: 50vw;
      background-color: #f8f9fa;
      border-radius: 1.5vw;
      box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h2 {
      font-size: 2.5vw;
      color: #2C4FA0;
      margin-bottom: 3vh;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 2vh;
      align-items: center;
    }

    label {
      font-weight: 700;
      font-size: 1.2vw;
      align-self: flex-start;
      margin-left: 2vw;
    }

    input[type="text"], input[type="email"] {
      padding: 1vh 1vw;
      font-size: 1.2vw;
      border: 1px solid #2C4FA0;
      border-radius: 0.5vw;
      width: 80%;
      max-width: 30vw;
    }

    input[type="submit"] {
      margin-top: 2vh;
      padding: 1vh 2vw;
      font-size: 1.2vw;
      background-color: #2C4FA0;
      color: white;
      border: none;
      border-radius: 1vw;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #1d3671;
    }

    .return-link {
      display: block;
      margin-top: 2vh;
      font-size: 1.2vw;
      color: #2C4FA0;
      text-decoration: none;
    }

    .return-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="page-section">
    <h2>Reset Your Email</h2>
    <form method="POST">
      <label for="newEmail1">New Email:</label>
      <input type="email" id="newEmail1" name="newEmail1" required>

      <label for="newEmail2">Confirm New Email:</label>
      <input type="email" id="newEmail2" name="newEmail2" required>

      <input type="submit" value="Submit">
    </form>
    <a href="/employeePortal" class="return-link">Return to Portal</a>
  </div>
  {% with messages = get_flashed_messages() %}
      {% if messages %}
        <script>
          alert("{{ messages[0] }}");
        </script>
      {% endif %}
    {% endwith %}
</body>
</html>
