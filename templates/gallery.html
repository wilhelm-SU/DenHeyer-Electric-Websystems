<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DenHeyer Electric - Gallery</title>


  <style>
    .page-section {
      padding: 4vh 4vw;
      max-width: 85vw;
      background-color: #f8f9fa;
      border-radius: 1.5vw;
      box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2vw;
      justify-items: center;
      padding-top: 3vh;
    }

    .image-item {
      text-align: center;
    }

    .image-item img {
      width: 200px;
      height: auto;
      border-radius: 1vw;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
    }

    .image-item h3 {
      font-size: 1.2vw;
      color: #2C4FA0;
      margin-top: 1vh;
    }

    .return-link {
      display: block;
      margin-top: 4vh;
      font-size: 1.2vw;
      color: #2C4FA0;
      text-decoration: none;
    }

    .return-link:hover {
      text-decoration: underline;
    }

    .page-section h2{
        color: #2C4FA0;
      text-align: center;
      font-size: 2.4vw;
    }

  </style>
</head>
<body>

{% include 'header.html' %}


  <div class="page-section">
    <h2>Welcome to the Gallery</h2>
    <div class="gallery">
      {% for image in image_list %}
        <div class="image-item">
          <img src="data:image/jpeg;base64,{{ image[1] }}" alt="{{ image[2] }}">
          <h3>{{ image[2] }}</h3>
        </div>
      {% else %}
        <p>No images available.</p>
      {% endfor %}
    </div>

    <a href="/" class="return-link">Return</a>
  </div>
</body>
</html>
