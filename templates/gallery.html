<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DenHeyer Electric - Gallery</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #e0e9ff;
      background-image: url("https://www.transparenttextures.com/patterns/lined-paper-2.png");
      background-repeat: repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    .header-bar {
      background-color: #2C4FA0;
      padding: 1vh 0;
      text-align: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .header-bar h1 {
      margin: 0;
    }

    .home-link {
      text-decoration: none;
      color: inherit;
    }

    .denheyer {
      font-family: 'Anton', sans-serif;
      font-size: 5vw;
      letter-spacing: .2vw;
      color: #ffffff;
    }

    .electric {
      font-family: 'Teko', sans-serif;
      font-size: 5vw;
      letter-spacing: .2vw;
      color: #ffffff;
    }

    .page-section {
      margin: 13vh auto;
      padding: 4vh 4vw;
      max-width: 85vw;
      background-color: #f8f9fa;
      border-radius: 1.5vw;
      box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2vw;
      justify-items: center;
      padding-top: 3vh;
    }

    .image-item {
      text-align: center;
    }

    .image-item img {
      width: 200px;
      height: auto;
      border-radius: 1vw;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
    }

    .image-item h3 {
      font-size: 1.2vw;
      color: #2C4FA0;
      margin-top: 1vh;
    }

    .return-link {
      display: block;
      margin-top: 4vh;
      font-size: 1.2vw;
      color: #2C4FA0;
      text-decoration: none;
    }

    .return-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <h1>
      <a href="/" class="home-link">
        <span class="denheyer">DenHeyer </span>
        <span class="electric">ELECTRIC</span>
      </a>
    </h1>
  </div>

  <div class="page-section">
    <h2>Welcome to the Gallery</h2>
    <div class="gallery">
      {% for image in image_list %}
        <div class="image-item">
          <img src="data:image/jpeg;base64,{{ image[1] }}" alt="{{ image[2] }}">
          <h3>{{ image[2] }}</h3>
        </div>
      {% else %}
        <p>No images available.</p>
      {% endfor %}
    </div>

    <a href="/employeePortal" class="return-link">Return to Portal</a>
  </div>
</body>
</html>
