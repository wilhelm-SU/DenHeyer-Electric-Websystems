
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

    body {
      background-color: #e0e9ff;
      background-image: url("https://www.transparenttextures.com/patterns/lined-paper-2.png");
      background-repeat: repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    .header-bar {
      background-color: #2C4FA0;
      padding: 2vh 0;
      text-align: center;
      position: relative;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .header-bar h1 {
      color: #2C4FA0;
    }

    .lightbulb {
      position: absolute;
      top: 1vh;
      left: 3vh;
      height: 21vw;
      width: auto;
      z-index: 2;
    }

    .title-oval {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      border-radius: 20vw;
      padding: .7vh 3vw;
      margin: 0 2vw 1.3vh 2vw;
      max-width: calc(100% - 10vw);
      box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.2);
    }

    .title-wrapper {
      display: flex;
      flex-direction: column;
      line-height: .8;
      margin-top: -1vh;
      padding-left: 17vw;
    }

    .denheyer {
      font-family: 'Anton', sans-serif;
      font-size: 7vw;
      letter-spacing: .3vw;
    }

    .electric {
      font-family: 'Teko', sans-serif;
      font-size: 7vw;
      letter-spacing: .3vw;
    }

    .subtitle {
      margin-top: -.8vh;
      margin-bottom: .9vh;
      font-size: 2.3vw;
      color: #0a1125;
      font-family: 'Kanit', sans-serif;
      font-style: italic;
      text-decoration: underline;
    }

    .navbar {
      display: flex;
      gap: 11vw;
      padding-left: 21vw;

    }

    .navbar a, .dropbtn {
      color: #F0F0F0;
      text-decoration: none;
      font-size: 2vw;
      padding: .5vh;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Kanit', sans-serif;
    }

    .navbar a:hover, .dropbtn:hover {
      background-color: #A3B6E9;
      border-radius: .3vh;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #F8F9FA;
      min-width: 14vw;
      box-shadow: 0 .5vh 1vh rgba(0, 0, 0, 0.2);
      z-index: 1;
      border-radius: 1vh;
    }

    .dropdown-content a {
      color: black;
      padding: 1vh;
      display: block;
      text-align: left;
      font-size: 1.3vw;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .header-spacer {
        height: 5vh;
        width: 100%;
    }

    .home-link {
      text-decoration: none;
      color: inherit;
    }

    .contact-float {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: #2C4FA0;
      color: white;
      padding: 1.2vh 1vw;
      border-radius: 1vw 0 0 1vw;
      cursor: pointer;
      font-size: 1.1vw;
      font-family: 'Kanit', sans-serif;
      box-shadow: -0.3vw 0 0.8vw rgba(0,0,0,0.2);
      z-index: 999;
    }

    /* Slide-out panel */
    .contact-panel {
      position: fixed;
      right: -320px;
      top: 50%;
      transform: translateY(-50%);
      width: 300px;
      background: white;
      padding: 2vh 1.5vw;
      box-shadow: -0.5vw 0 1vw rgba(0,0,0,0.2);
      border-radius: 1vw 0 0 1vw;
      transition: right 0.3s ease;
      font-family: 'Kanit', sans-serif;
      z-index: 998;
    }

    .contact-panel.open {
      right: 0;
    }

@media (max-width: 768px) {

    .navbar {
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        gap: .1vw;
        padding: 0;
        margin-bottom: -3vw;
    }

    .navbar a,
    .dropbtn {
        font-size: 3.8vw;
        padding: 1vh 1.5vw;
        width: auto;
        text-align: center;
        margin: 0;
        white-space: nowrap;
    }

    .dropdown {
        position: relative; /* keep menu relative to button */
    }

    .dropdown-content {
        position: absolute;
        right: 0; /* align right edge of menu to right edge of button */
        left: auto; /* ignore left */
        min-width: 150px; /* or auto, whatever fits content */
        max-width: 90vw; /* never overflow viewport */
        box-sizing: border-box;
    }

    .dropdown-content a {
        font-size: 3.8vw;
        padding: 1vh 1.5vw;
    }

    .denheyer {
        font-family: 'Anton', sans-serif;
        font-size: 8vw;
        letter-spacing: .3vw;
    }

    .electric {
        font-family: 'Teko', sans-serif;
        font-size: 8vw;
        letter-spacing: .3vw;
    }
}

</style>

<!-- Header with Title and Contact Info -->
  <div class="header-bar">
    <img src="/static/images/LightBulbOG_AnniePaxson.png" alt="Lightbulb" class="lightbulb">
    <div class="title-oval">
      <div class="title-wrapper">
          <h1>
            <a href="/" class="home-link">
              <span class="denheyer">DenHeyer  </span>
              <span class="electric"> ELECTRIC</span>
            </a>
          </h1>
          <p class="subtitle">Serving the Sussex County area since 2015</p>
        </div>

    </div>
    <nav class="navbar">
      <a href="/requestEstimate">Request Estimate</a>
      <a href="/gallery">Gallery</a>
      <a href="/reviews">Reviews</a>
      <div class="dropdown">
        <button class="dropbtn">More ▼</button>
        <div class="dropdown-content">
          <a href="/aboutUs">About Us</a>
          <a href="/FAQ">FAQ</a>
          <a href="/certifsAndInsurance">Payment</a>
          <a href="/certifsAndInsurance">Insurance</a>
          <a href="/employeePortal">Employee Portal</a>
        </div>
      </div>
    </nav>
  </div>
<div class="header-spacer"></div>

<div class="contact-float" onclick="toggleContact()">
  Contact
</div>

<div class="contact-panel" id="contactPanel">
  <p><strong>Phone:</strong> (862) 268-1290</p>
  <p><strong>Email:</strong> Denheyerelectric@gmail.com</p>
  <p><strong>Hours:</strong> M–F 8am–4pm</p>
  <p><strong>Address:</strong> 24 County Rd 639 Wantage, NJ 07461</p>
</div>

  document.getElementById("contactPanel").classList.toggle("open");
}
</script>
