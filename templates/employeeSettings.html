<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #e0e9ff;
      background-image: url("https://www.transparenttextures.com/patterns/lined-paper-2.png");
      background-repeat: repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
    }

    .header-bar {
      background-color: #2C4FA0;
      padding: -2vh 0;
      text-align: center;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1;
    }

    .header-bar h1 {
      margin: 0;
    }

    .home-link {
      text-decoration: none;
      color: inherit;
    }

    .denheyer {
      font-family: 'Anton', sans-serif;
      font-size: 5vw;
      letter-spacing: .2vw;
      color: #ffffff;
    }

    .electric {
      font-family: 'Teko', sans-serif;
      font-size: 5vw;
      letter-spacing: .2vw;
      color: #ffffff;
    }

    .page-section {
      margin: 14vh auto;
      padding: 4vh 4vw;
      max-width: 50vw;
      background-color: #f8f9fa;
      border-radius: 1.5vw;
      box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h2 {
      font-size: 2.5vw;
      color: #2C4FA0;
      margin-bottom: 2vh;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    ul li {
      margin: 1vh 0;
    }

    a {
      font-size: 1.2vw;
      text-decoration: none;
      color: #2C4FA0;
    }

    a:hover {
      text-decoration: underline;
    }

    p {
      font-size: 1.2vw;
      margin-top: 4vh;
    }

    button {
      background-color: #2C4FA0;
      color: white;
      padding: 1vh 2vw;
      border: none;
      border-radius: 1vw;
      font-size: 1.2vw;
      cursor: pointer;
      margin-top: 2vh;
    }

    button:hover {
      background-color: #1d3671;
    }

    .return-link {
      display: block;
      margin-top: 4vh;
      font-size: 1.2vw;
      color: #2C4FA0;
      text-decoration: none;
    }

    .return-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<!-- Header with split-font title -->
  <div class="header-bar">
    <h1>
      <a href="/" class="home-link">
        <span class="denheyer">DenHeyer </span>
        <span class="electric">ELECTRIC</span>
      </a>
    </h1>
  </div>
<body>
  <div class="page-section">
    <h2>Employee Settings</h2>

    <ul>
      <li><a href="/resetUsername">Reset Username</a></li>
      <li><a href="/resetPassword">Reset Password</a></li>
      <li><a href="/resetEmail">Reset Email</a></li>
    </ul>

    <p>{{ status_message }}</p>

    <form method="POST" action="/emailList">
      <button type="submit">{{ button_label }}</button>
    </form>
      <a href="/employeePortal" class="return-link">Return to Portal</a>
  </div>
</body>
</html>
