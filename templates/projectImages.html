<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>{{ project.title }}</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Kanit',sans-serif;
    background:#e0e9ff;
    margin:0;
}

.header{
    background:#2C4FA0;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:1200px;
    margin:30px auto;
}

.project-info{

    background:white;
    border-radius:10px;
    padding:20px;
    margin-bottom:30px;

}

.gallery{

    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:25px;

}

.card{

    background:white;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    padding:15px;
    text-align:center;

}

.card img{

    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:8px;

}

button{

    margin-top:15px;
    background:#d9534f;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
    border-radius:6px;

}

.upload{

    margin-bottom:35px;
    background:white;
    padding:20px;
    border-radius:10px;

}

.back{

    display:inline-block;
    margin-top:25px;
    color:#2C4FA0;
    text-decoration:none;

}

</style>

</head>

<body>

<div class="header">

<h1>{{ project.title }}</h1>

</div>

<div class="container">

<div class="project-info">

<h2>{{ project.title }}</h2>

<p>{{ project.description }}</p>

<p>

Status:

{% if project.public %}

🟢 Public

{% else %}

🔴 Private

{% endif %}

</p>

</div>

<div class="upload">

<h3>Upload Images</h3>

<form
action="/insertImage"
method="POST"
enctype="multipart/form-data">

<input
type="hidden"
name="project_id"
value="{{ project.id }}">

<input
type="file"
name="image"
accept="image/*"
multiple
required>

<br><br>

<button type="submit">
Upload
</button>

</form>

</div>

<div class="gallery">

{% for image in image_list %}

<div class="card">

<img
src="data:image/jpeg;base64,{{ image.thumbnail }}">

<form
action="/deleteImage/{{ image.id }}"
method="POST">

<button
type="submit"
onclick="return confirm('Delete this image?')">

Delete Image

</button>

</form>

</div>

{% else %}

<p>No images have been uploaded yet.</p>

{% endfor %}

</div>

<a
class="back"
href="/galleryManager/galleryManager">

← Back to Gallery Manager

</a>

</div>

</body>
</html>
