<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify Your Identity</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">

    <link rel="icon" href="/static/images/LightBulbOG_AnniePaxson.png" sizes="any">
  <link rel="icon" type="image/png" href="/static/images/LightBulbOG_AnniePaxson.png">
  <link rel="apple-touch-icon" href="/static/images/LightBulbOG_AnniePaxson.png">

  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #e0e9ff;
      background-image: url("https://www.transparenttextures.com/patterns/lined-paper-2.png");
      background-repeat: repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .verify-form {
      background-color: #f8f9fa;
      padding: 4vh 4vw;
      border-radius: 1.5vw;
      box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    label, input, a {
      display: block;
      margin: 1vh auto;
      font-size: 1.2vw;
    }

    input[type="password"] {
      padding: 1vh 1vw;
      width: 80%;
      border: 1px solid #2C4FA0;
      border-radius: 0.5vw;
    }

    input[type="submit"] {
      background-color: #2C4FA0;
      color: white;
      padding: 1vh 2vw;
      border: none;
      border-radius: 1vw;
      cursor: pointer;
      margin-top: 2vh;
      font-size: 1.2vw;
    }

    input[type="submit"]:hover {
      background-color: #1d3671;
    }

    a {
      color: #2C4FA0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <form method="POST" class="verify-form">
    <label for="password">Please enter your current password to continue:</label>
    <input type="password" id="password" name="password" required>
    <input type="submit" value="Verify">
    <a href="/employeePortal">Return</a>
  </form>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <script>
          alert("{{ messages[0] }}");
        </script>
      {% endif %}
    {% endwith %}
</body>
</html>
