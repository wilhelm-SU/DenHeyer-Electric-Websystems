<!DOCTYPE html>
<html>
<head>
  <title>Review Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #f0f0f0;
      padding: 3vh;
    }
    .review-container {
      background: white;
      padding: 2vh;
      border-radius: 1vw;
      box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.1);
      margin-bottom: 3vh;
    }
  </style>
</head>
<body>

  <h2>Public Reviews</h2>

  <div class="review-container">
    {{ formatted_reviews_public | safe }}
  </div>

  <a href="/reviewManager/private">View New and Private Reviews</a><br>
  <a href="/employeePortal">Return to Portal</a>

</body>
</html>
