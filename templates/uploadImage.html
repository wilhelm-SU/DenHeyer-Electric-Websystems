<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Images - DenHeyer Electric</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">

<link rel="icon" href="/static/images/LightBulbOG_AnniePaxson.png" sizes="any">
<link rel="icon" type="image/png" href="/static/images/LightBulbOG_AnniePaxson.png">
<link rel="apple-touch-icon" href="/static/images/LightBulbOG_AnniePaxson.png">

<style>

body{
    font-family:'Kanit',sans-serif;
    background:#e0e9ff url("https://www.transparenttextures.com/patterns/lined-paper-2.png");
    margin:0;
}

.header-bar{
    background:#2C4FA0;
    position:fixed;
    width:100%;
    top:0;
    text-align:center;
    padding:1vh;
}

.header-bar h1{
    margin:0;
}

.home-link{
    text-decoration:none;
    color:white;
}

.denheyer{
    font-family:'Anton';
    font-size:5vw;
}

.electric{
    font-family:'Teko';
    font-size:5vw;
}

.page-section{
    margin:13vh auto;
    max-width:650px;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    text-align:center;
}

select,
input[type=file]{
    width:100%;
    padding:12px;
    margin:15px 0;
    font-size:1rem;
}

button{
    background:#2C4FA0;
    color:white;
    border:none;
    padding:12px 24px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#1d3671;
}

.return-link{
    display:block;
    margin-top:25px;
    color:#2C4FA0;
    text-decoration:none;
}

.return-link:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="header-bar">
<h1>
<a href="/employeePortal" class="home-link">
<span class="denheyer">DenHeyer </span>
<span class="electric">ELECTRIC</span>
</a>
</h1>
</div>

<div class="page-section">

<h2>Upload Images</h2>

<p>Select a project, then choose one or more images to upload.</p>

<form action="/insertImage" method="POST" enctype="multipart/form-data">

<label for="project_id">
<strong>Project</strong>
</label>

<select name="project_id" id="project_id" required>

<option value="">-- Select Project --</option>

{% for project in project_list %}
<option value="{{ project.id }}">
    {{ project.title }}
</option>
{% endfor %}

</select>

<br><br>

<label for="image">
<strong>Select Images</strong>
</label>

<input
type="file"
name="image"
id="image"
accept="image/*"
multiple
required>

<br><br>

<button type="submit">
Upload Images
</button>

</form>

<a href="/galleryManager/galleryManager" class="return-link">
Back to Gallery Manager
</a>

</div>

</body>
</html>
