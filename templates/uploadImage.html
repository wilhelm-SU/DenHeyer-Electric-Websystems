<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Image - DenHeyer Electric</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #e0e9ff;
      background-image: url("https://www.transparenttextures.com/patterns/lined-paper-2.png");
      background-repeat: repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
    }

    .header-bar {
      background-color: #2C4FA0;
      padding: 1vh 0;
      text-align: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .header-bar h1 {
      margin: 0;
    }

    .home-link {
      text-decoration: none;
      color: inherit;
    }

    .denheyer {
      font-family: 'Anton', sans-serif;
      font-size: 5vw;
      letter-spacing: .2vw;
      color: #ffffff;
    }

    .electric {
      font-family: 'Teko', sans-serif;
      font-size: 5vw;
      letter-spacing: .2vw;
      color: #ffffff;
    }

    .page-section {
      margin: 13vh auto;
      padding: 4vh 2vw;
      max-width: 60vw;
      background-color: #f8f9fa;
      border-radius: 1.5vw;
      box-shadow: 0 0.5vh 1vh rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    label, input, button {
      font-size: 1.2vw;
      margin-bottom: 1vh;
    }

    input[type="text"], input[type="file"] {
      width: 80%;
      padding: 1vh;
      font-size: 1vw;
      margin: 1vh auto;
      border-radius: 0.5vw;
      border: 1px solid #ccc;
    }

    button {
      background-color: #2C4FA0;
      color: white;
      padding: 1vh 2vw;
      border: none;
      border-radius: 1vw;
      font-size: 1.2vw;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d3671;
    }

    .return-link {
      display: block;
      text-align: center;
      margin-top: 3vh;
      font-size: 1.2vw;
      color: #2C4FA0;
      text-decoration: none;
    }
    .return-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <h1>
      <a href="/employeePortal" class="home-link">
        <span class="denheyer">DenHeyer </span>
        <span class="electric">ELECTRIC</span>
      </a>
    </h1>
  </div>

  <div class="page-section">
    <h2>Upload a New Image</h2>
    <form action="/insertImage" method="POST" enctype="multipart/form-data">
      <label for="description">Description:</label><br>
      <input type="text" name="description" id="description"><br><br>

      <label for="public">Public?</label>
      <input type="checkbox" name="public" id="public"><br><br>

      <label for="image">Choose an image to upload:</label><br>
      <input type="file" name="image" id="image" accept="image/*" required><br><br>

      <button type="submit">Upload</button>
    </form>
    <a href="/galleryManager" class="return-link">Back to Gallery Manager</a>
  </div>
</body>
</html>
